<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <style>
        body{ font-family: sans-serif; text-align: center;}
        h1{ color: #333;}
        .box {width: 120px; height: 120px; display: inline-block; margin: 8px;color:while; line-height: 120px;}
        #red {background: #e63946;}
        #blue {background: #457b9d;}
        #green {background: #457b9d;}
        #yellow {background: #f4a261; color: #333;}

    </style>
</head>
<body>
    <h1>my colors</h1>
    <div class="box" id="blue">Red</div>
    <div class="box" id="green">green</div>
    <div class="box" id="yellow">yellow</div>
</body>
</html>
