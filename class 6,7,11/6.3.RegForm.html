<!DOCTYPE html>
<html lang="en">
<head>
    <title>registration form</title>
</head>
<body>
    <h1> নতুন account খোলা</h1>
    <form action="/register" method="POST" encrypt="multiple/form-data"></form> </form>
    <fieldset>
        <legend> Person info</legend>
        <p>
            <label for="name">পুরো নাম </label>
            <input type="text" id="name" name="name" required minlength="3"/>
        </p>

        <p>
            <label for ="email">ইমেইল</label><br>
            <input typer ="email" id ="email" email="email" required/>
        </p>

        <p>
                <label for="phone">ফোন</label><br/>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="01700000000"/>
            </p>


        <p>
            <label for ="password">Password*</label><br>
            <input typer ="password" id ="password" password="password" required minlength="6"/>
        </p>
    </fieldset>

    <fieldset>
        <legend>অন্যান্য</legend>
        <p>
            লিঙ্গঃ <br>
            <input type = "radio" id = "m" name = "gender" value = "male"/>
            <label for="m">পুরুষ</label>
            <input type = "radio" id = "m" name = "gender" value = "female"/>
            <label for="f">মহিলা</label>
        </p>

        <p>
            <label for="city">শহরঃ </label><br>
            <select id="city" name="city">
                <option value="">বেঁছে নাও</option>
                <option value="dhaka">ঢাকা</option>
                <option value="ctg">চট্টগ্রাম</option>
                <option value="syl">সিলেট</option>
            </select>
        </p>
        <p>
            শখঃ <br>
            <input type = "checkbox" id = "h1" name = "hobby" value = "reading"/>
            <label for="h1">বই পড়া </label>
            <input type = "checkbox" id = "h2" name = "hobby" value = "coding"/>
            <label for="h2">কোডিং</label>
        </p>

        <p>
            <label for="pic" >Profile Photo:</label> <br />
            <input type="file" id="pic" name="pic" accept= "image/*" />
        </p>

        <p>
            <label for="exp"> Experience(years):</label><br />
            <input type="range" id="exp" name="exp" min="0" max="20" value="1" />
        </p>

        <p>
            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color" />
        </p>

        <p>
            <label for="about">নিজের সম্পর্কে:</label><br />
            <textarea id="about" name="about" rows="4" cols="40"></textarea>
        </p>

        <p>
            <input type="checkbox" id="tos" required/>
            <label for="tos"></label>
        </p>


    </fieldset>
</body>
</html>
