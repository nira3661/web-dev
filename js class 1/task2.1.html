<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#f5f5f5">
</pre>
<script>
  const log = (m) =>document.getElementById("out").textContent += m + "\n";
  let age = 20;
  log("age প্রথমে: " +age);
  age = 21;
  log("age এখন: "+age);
  const pi =3.14;
  log("pi (const): " + pi);
  try { pi = 3.15; } catch(e){ log("const বদলানো যায় না: "+ e.message); }
</script>
</body>
</html>
