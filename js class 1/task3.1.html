<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#f5f5f5">
</pre>
<script>
  const log=(m)=> document.getElementById("out").textContent += m + "\n";
  const name= "Rahim", age = 22, active = true;
  const fruits = ["Apple", "Mango"];
  const user ={name: "Karim", age: 25};
  log("String: " + name + " (typeof " + typeof name + ")");
  log("Number: "+age );
  log("Boolean: "+ active) ;
  log("Array[0]: "+fruits[0] );
  log("Object.name: "+user.name);
  log(`Template: Hello ${name}, age ${age}`);
</script>
</body>
</html>
