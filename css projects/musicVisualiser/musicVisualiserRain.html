<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bioluminescent Rain • Calming Soundboard & Visualizer</title>
  <link rel="stylesheet" href="musicVisualiserRain.css">
</head>
<body>
  <!-- Canvas Surface -->
  <canvas id="canvas"></canvas>

  <!-- Drag Overlay -->
  <div id="dragOverlay" class="drag-overlay">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <span>Drop Audio File Here</span>
  </div>

  <!-- Top Title Banner -->
  <div id="topBar" class="top-bar">
    <div class="title">Bioluminescent Rain</div>
    <div class="subtitle">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ambient Drizzle • Nocturnal Waters</span>
    </div>
  </div>

  <!-- Hint Toast -->
  <div id="hintToast" class="hint-toast">
    Click or tap anywhere on the water to ring harmonic ripples
  </div>

  <!-- Track Progress Bar & Details -->
  <div id="trackPill" class="track-pill">
    <span id="trackName" class="track-name">Zen Meditation Drone</span>
    <div id="scrubberBar" class="scrubber-bar" title="Seek">
      <div id="scrubberFill" class="scrubber-fill"></div>
    </div>
    <span id="trackTime" class="track-time">0:00 / 0:00</span>
  </div>

  <!-- Floating Glassmorphic Control Dock -->
  <div id="controlDock" class="dock-container">
    <!-- File Upload -->
    <input type="file" id="audioFileInput" accept="audio/*">
    <button class="btn" id="uploadBtn" data-tooltip="Upload Audio (MP3/WAV)" aria-label="Upload audio">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </button>

    <!-- Play / Pause -->
    <button class="btn primary" id="playBtn" data-tooltip="Play / Pause" aria-label="Play or Pause">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>

    <div class="dock-divider"></div>

    <!-- Built-in Ambient Rain Toggle -->
    <button class="btn" id="rainBtn" data-tooltip="Ambient Rain Sound (R)" aria-label="Toggle synthetic rain">
      <svg viewBox="0 0 24 24">
        <path d="M4.5 10.5C3.67 10.5 3 11.17 3 12c0 2.49 2.01 4.5 4.5 4.5h10c2.49 0 4.5-2.01 4.5-4.5 0-2.31-1.74-4.21-4-4.46V7.5C18 4.46 15.54 2 12.5 2 9.87 2 7.67 3.84 7.11 6.32 5.58 6.84 4.5 8.52 4.5 10.5zm3.5 8.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm4 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm4 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
      </svg>
    </button>

    <!-- Procedural Zen Ambient Chords Toggle -->
    <button class="btn" id="zenBtn" data-tooltip="Procedural Zen Music (Z)" aria-label="Toggle zen ambient music">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </button>

    <!-- Soundboard Chimes Toggle -->
    <button class="btn active" id="chimeBtn" data-tooltip="Water Drop Chimes (C)" aria-label="Toggle drop chime sounds">
      <svg viewBox="0 0 24 24">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
      </svg>
    </button>

    <!-- Live Microphone Input Toggle -->
    <button class="btn" id="micBtn" data-tooltip="Live Mic Reactivity" aria-label="Toggle microphone reactivity">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
      </svg>
    </button>

    <div class="dock-divider"></div>

    <!-- Volume Slider Popover -->
    <div class="vol-container">
      <button class="btn" id="muteBtn" data-tooltip="Volume / Mute (M)" aria-label="Mute or unmute">
        <svg id="volHighIcon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="volMuteIcon" viewBox="0 0 24 24" style="display: none;">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
      <div class="vol-slider-wrap">
        <input type="range" id="volSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <!-- Fullscreen Toggle -->
    <button class="btn" id="fullscreenBtn" data-tooltip="Fullscreen (F)" aria-label="Toggle fullscreen">
      <svg id="enterFsIcon" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
      <svg id="exitFsIcon" viewBox="0 0 24 24" style="display: none;">
        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z"/>
      </svg>
    </button>
  </div>

  <script>
    /* ==========================================================================
       BIOLUMINESCENT RAIN & SOUNDBOARD VISUALIZER
       Self-contained Vanilla JS with Web Audio API & HTML5 Canvas
       ========================================================================== */

    (function() {
      'use strict';

      // --- DOM Elements ---
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const topBar = document.getElementById('topBar');
      const controlDock = document.getElementById('controlDock');
      const trackPill = document.getElementById('trackPill');
      const trackName = document.getElementById('trackName');
      const trackTime = document.getElementById('trackTime');
      const scrubberBar = document.getElementById('scrubberBar');
      const scrubberFill = document.getElementById('scrubberFill');
      const hintToast = document.getElementById('hintToast');
      const statusText = document.getElementById('statusText');
      const dragOverlay = document.getElementById('dragOverlay');

      // Buttons
      const uploadBtn = document.getElementById('uploadBtn');
      const audioFileInput = document.getElementById('audioFileInput');
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const rainBtn = document.getElementById('rainBtn');
      const zenBtn = document.getElementById('zenBtn');
      const chimeBtn = document.getElementById('chimeBtn');
      const micBtn = document.getElementById('micBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volHighIcon = document.getElementById('volHighIcon');
      const volMuteIcon = document.getElementById('volMuteIcon');
      const volSlider = document.getElementById('volSlider');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const enterFsIcon = document.getElementById('enterFsIcon');
      const exitFsIcon = document.getElementById('exitFsIcon');

      // --- Scene Constants & Palette ---
      const WATER_RATIO = 0.65; // Water surface line at 65% down viewport
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;
      let waterY = height * WATER_RATIO;

      // Bioluminescent Color Spectrum
      const PALETTE = [
        { name: 'cyan',     h: 184, s: 92, l: 68 }, // bioluminescent cyan
        { name: 'violet',   h: 274, s: 84, l: 74 }, // ethereal violet
        { name: 'peach',    h: 18,  s: 92, l: 75 }, // soft warm peach
        { name: 'seafoam',  h: 156, s: 86, l: 70 }, // seafoam mint
        { name: 'moonlight',h: 215, s: 88, l: 82 }  // moonlight silver
      ];

      const BASS_PALETTE = [
        { h: 338, s: 82, l: 72 }, // warm glowing rose
        { h: 268, s: 88, l: 68 }, // deep resonant violet
        { h: 24,  s: 95, l: 72 }  // soft warm amber
      ];

      // --- Pentatonic Harmony Frequencies for Drop Chimes ---
      // D minor / Insen pentatonic scale (D4, F4, G4, A4, C5, D5, F5, A5)
      const CHIME_FREQS = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46, 880.00];

      // --- Web Audio Engine ---
      let audioCtx = null;
      let analyser = null;
      let freqData = null;
      let timeData = null;
      let masterGain = null;

      // Audio Sources
      let audioElement = new Audio();
      audioElement.crossOrigin = 'anonymous';
      audioElement.loop = true;
      let mediaSourceNode = null;
      let isFileLoaded = false;
      let isPlayingAudio = false;

      // Synthetic Rain Generator
      let isRainActive = false;
      let rainNoiseSource = null;
      let rainGain = null;
      let rainFilter = null;
      let rainIntervalId = null;

      // Zen Ambient Music Generator
      let isZenActive = false;
      let zenGain = null;
      let zenIntervalId = null;
      let zenChordStep = 0;

      // Microphone
      let isMicActive = false;
      let micStream = null;
      let micSourceNode = null;

      // Drop Chimes
      let isChimeActive = true;

      // Master volume & mute
      let currentVolume = 0.8;
      let isMuted = false;

      // Audio Energy Tracking
      let audioBass = 0;
      let audioMid = 0;
      let audioHigh = 0;
      let audioOverall = 0;
      let bassEMA = 0;
      let lastBassDropTime = 0;

      // --- Visual Simulation Objects ---
      const drops = [];
      const ripples = [];
      const splashes = [];
      const spores = []; // soft floating ambient bioluminescent particles
      let lastDropSpawnTime = 0;

      // Controls Auto-Hide
      let idleTimer = null;
      let isDockHovered = false;

      // ==========================================================================
      // WEB AUDIO API INITIALIZATION & ENGINES
      // ==========================================================================

      function initAudioContext() {
        if (audioCtx) {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          return;
        }

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.82;
        analyser.connect(masterGain);

        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.frequencyBinCount);

        // Pre-create Rain Gain node connected to analyser
        rainGain = audioCtx.createGain();
        rainGain.gain.setValueAtTime(0, audioCtx.currentTime);
        rainGain.connect(analyser);

        // Zen Gain node
        zenGain = audioCtx.createGain();
        zenGain.gain.setValueAtTime(0, audioCtx.currentTime);
        zenGain.connect(analyser);
      }

      // --------------------------------------------------------------------------
      // 1. Synthetic Rain Generator (Pink Noise + Lowpass + Trickle Drops)
      // --------------------------------------------------------------------------
      function toggleSyntheticRain() {
        initAudioContext();

        if (isRainActive) {
          stopSyntheticRain();
        } else {
          startSyntheticRain();
        }
      }

      function startSyntheticRain() {
        if (!audioCtx || isRainActive) return;

        // Generate 4-second seamless pink noise buffer
        const bufferSize = audioCtx.sampleRate * 4;
        const noiseBuffer = audioCtx.createBuffer(2, bufferSize, audioCtx.sampleRate);
        for (let channel = 0; channel < 2; channel++) {
          const output = noiseBuffer.getChannelData(channel);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            b6 = white * 0.115926;
            output[i] = pink * 0.08;
          }
        }

        rainNoiseSource = audioCtx.createBufferSource();
        rainNoiseSource.buffer = noiseBuffer;
        rainNoiseSource.loop = true;

        // Gentle dual-filtering for organic rain timbre
        rainFilter = audioCtx.createBiquadFilter();
        rainFilter.type = 'lowpass';
        rainFilter.frequency.setValueAtTime(1100, audioCtx.currentTime);
        rainFilter.Q.setValueAtTime(0.7, audioCtx.currentTime);

        const highpass = audioCtx.createBiquadFilter();
        highpass.type = 'highpass';
        highpass.frequency.setValueAtTime(160, audioCtx.currentTime);

        // LFO for natural atmospheric swell in rain intensity
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime); // 8-second cycle
        lfoGain.gain.setValueAtTime(180, audioCtx.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(rainFilter.frequency);
        lfo.start();

        rainNoiseSource.connect(highpass);
        highpass.connect(rainFilter);
        rainFilter.connect(rainGain);

        // Fade in rain gain
        rainGain.gain.cancelScheduledValues(audioCtx.currentTime);
        rainGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        rainGain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 1.2);

        rainNoiseSource.start();
        isRainActive = true;
        rainBtn.classList.add('active');

        // Occasional soft micro-trickle sounds
        rainIntervalId = setInterval(() => {
          if (!isRainActive || Math.random() > 0.45) return;
          playSoftWaterBloop(0.05 + Math.random() * 0.06);
        }, 320);

        updateStatusText();
      }

      function stopSyntheticRain() {
        if (!isRainActive) return;
        if (rainGain && audioCtx) {
          rainGain.gain.cancelScheduledValues(audioCtx.currentTime);
          rainGain.gain.setValueAtTime(rainGain.gain.value, audioCtx.currentTime);
          rainGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        }
        setTimeout(() => {
          if (rainNoiseSource) {
            try { rainNoiseSource.stop(); } catch (e) {}
            rainNoiseSource.disconnect();
            rainNoiseSource = null;
          }
        }, 900);

        if (rainIntervalId) {
          clearInterval(rainIntervalId);
          rainIntervalId = null;
        }

        isRainActive = false;
        rainBtn.classList.remove('active');
        updateStatusText();
      }

      // Soft natural water droplet "bloop / plink" synthesis
      function playSoftWaterBloop(vol = 0.08) {
        if (!audioCtx || audioCtx.state === 'suspended') return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const startFreq = 800 + Math.random() * 800;
          const endFreq = startFreq * 0.65;
          const now = audioCtx.currentTime;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.065);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

          osc.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      // --------------------------------------------------------------------------
      // 2. Interactive Pentatonic Water Chime (Soundboard Mode)
      // --------------------------------------------------------------------------
      function playWaterDropChime(pitchIndex = -1, clickDepth = 0.5) {
        if (!isChimeActive) return;
        initAudioContext();
        if (!audioCtx) return;

        try {
          const now = audioCtx.currentTime;
          let freq;
          if (pitchIndex >= 0 && pitchIndex < CHIME_FREQS.length) {
            freq = CHIME_FREQS[pitchIndex];
          } else {
            // Pick based on depth or random pentatonic
            const idx = Math.floor(clickDepth * CHIME_FREQS.length);
            freq = CHIME_FREQS[Math.min(idx, CHIME_FREQS.length - 1)];
          }

          // Fundamental oscillator with subtle pitch bend
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq * 1.08, now);
          osc1.frequency.exponentialRampToValueAtTime(freq, now + 0.04);

          // Harmonic overtone for liquid glass bell resonance
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2.756, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(freq * 4.5, now);
          filter.Q.setValueAtTime(3.0, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(analyser);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.7);
          osc2.stop(now + 1.7);
        } catch (e) {}
      }

      // --------------------------------------------------------------------------
      // 3. Procedural Zen Ambient Chords Engine (Built-in Calming Music)
      // --------------------------------------------------------------------------
      const ZEN_CHORDS = [
        [155.56, 196.00, 233.08, 293.66], // Ebmaj7 (Eb3, G3, Bb3, D4)
        [130.81, 196.00, 233.08, 261.63, 311.13], // Cm9 (C3, G3, Bb3, C4, Eb4)
        [103.83, 155.56, 207.65, 261.63], // Abmaj7 (Ab2, Eb3, Ab3, C4)
        [116.54, 174.61, 233.08, 261.63, 349.23]  // Bbadd9 (Bb2, F3, Bb3, C4, F4)
      ];

      function toggleZenMusic() {
        initAudioContext();
        if (isZenActive) {
          stopZenMusic();
        } else {
          startZenMusic();
        }
      }

      function startZenMusic() {
        if (!audioCtx || isZenActive) return;

        // If audio file was playing, pause it
        if (isFileLoaded && isPlayingAudio) {
          audioElement.pause();
          isPlayingAudio = false;
        }

        isZenActive = true;
        zenBtn.classList.add('active-alt');
        trackPill.classList.add('visible');
        trackName.textContent = "Procedural Zen Meditation Chords";
        trackTime.textContent = "Infinite Ambient Stream";
        scrubberFill.style.width = "100%";

        zenGain.gain.cancelScheduledValues(audioCtx.currentTime);
        zenGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        zenGain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 1.5);

        zenChordStep = 0;
        playZenChordCycle();
        zenIntervalId = setInterval(playZenChordCycle, 6400);

        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        updateStatusText();
      }

      function playZenChordCycle() {
        if (!isZenActive || !audioCtx) return;
        const chord = ZEN_CHORDS[zenChordStep % ZEN_CHORDS.length];
        zenChordStep++;
        const now = audioCtx.currentTime;
        const duration = 7.0;

        chord.forEach((freq, idx) => {
          try {
            const osc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = idx === 0 ? 'sine' : (idx % 2 === 0 ? 'triangle' : 'sine');
            osc.frequency.setValueAtTime(freq, now);

            // Subtle gentle vibrato
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.setValueAtTime(0.2 + idx * 0.05, now);
            lfoGain.gain.setValueAtTime(0.8, now);
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfo.start(now);
            lfo.stop(now + duration);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(freq * 2.8, now);
            filter.frequency.exponentialRampToValueAtTime(freq * 1.5, now + duration);

            noteGain.gain.setValueAtTime(0.0001, now);
            noteGain.gain.linearRampToValueAtTime(0.09 / chord.length, now + 1.8 + idx * 0.2);
            noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.connect(filter);
            filter.connect(noteGain);
            noteGain.connect(zenGain);

            osc.start(now + idx * 0.1);
            osc.stop(now + duration);
          } catch (e) {}
        });

        // Trigger a gentle harmonic central water ripple
        setTimeout(() => {
          if (!isZenActive) return;
          createRipple(width * 0.5 + (Math.random() - 0.5) * width * 0.3, waterY + (height - waterY) * 0.45, true);
        }, 1200);
      }

      function stopZenMusic() {
        if (!isZenActive) return;
        if (zenGain && audioCtx) {
          zenGain.gain.cancelScheduledValues(audioCtx.currentTime);
          zenGain.gain.setValueAtTime(zenGain.gain.value, audioCtx.currentTime);
          zenGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);
        }
        if (zenIntervalId) {
          clearInterval(zenIntervalId);
          zenIntervalId = null;
        }
        isZenActive = false;
        zenBtn.classList.remove('active-alt');
        if (!isFileLoaded || !isPlayingAudio) {
          trackPill.classList.remove('visible');
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        }
        updateStatusText();
      }

      // --------------------------------------------------------------------------
      // 4. Live Microphone Reactivity
      // --------------------------------------------------------------------------
      async function toggleMicrophone() {
        initAudioContext();
        if (isMicActive) {
          stopMicrophone();
        } else {
          try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            micSourceNode = audioCtx.createMediaStreamSource(micStream);
            // Mic connects to analyser only (not destination, to prevent acoustic feedback howl)
            micSourceNode.connect(analyser);
            isMicActive = true;
            micBtn.classList.add('active');
            updateStatusText();
          } catch (err) {
            console.warn('Microphone permission denied or unavailable:', err);
            alert('Microphone access was denied or is unavailable on this device.');
          }
        }
      }

      function stopMicrophone() {
        if (!isMicActive) return;
        if (micSourceNode) {
          micSourceNode.disconnect();
          micSourceNode = null;
        }
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        isMicActive = false;
        micBtn.classList.remove('active');
        updateStatusText();
      }

      // --------------------------------------------------------------------------
      // 5. Audio File Playback & Controls
      // --------------------------------------------------------------------------
      function handleAudioFileUpload(file) {
        if (!file) return;
        initAudioContext();

        const fileUrl = URL.createObjectURL(file);
        audioElement.src = fileUrl;
        audioElement.load();

        if (!mediaSourceNode) {
          mediaSourceNode = audioCtx.createMediaElementSource(audioElement);
          mediaSourceNode.connect(analyser);
        }

        isFileLoaded = true;
        trackName.textContent = file.name.replace(/\.[^/.]+$/, "");
        trackPill.classList.add('visible');

        // Stop zen mode if active
        if (isZenActive) stopZenMusic();

        audioElement.play().then(() => {
          isPlayingAudio = true;
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          updateStatusText();
        }).catch(err => {
          console.log('Autoplay deferred until user interaction');
        });
      }

      function togglePlayPause() {
        initAudioContext();

        if (isFileLoaded) {
          if (audioElement.paused) {
            if (isZenActive) stopZenMusic();
            audioElement.play();
            isPlayingAudio = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
          } else {
            audioElement.pause();
            isPlayingAudio = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
          }
        } else {
          // No audio file loaded: toggle built-in Zen Ambient Chords!
          toggleZenMusic();
        }
        updateStatusText();
      }

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      // Scrubber and Audio Time Updates
      audioElement.addEventListener('timeupdate', () => {
        if (isFileLoaded && audioElement.duration) {
          const progress = (audioElement.currentTime / audioElement.duration) * 100;
          scrubberFill.style.width = `${progress}%`;
          trackTime.textContent = `${formatTime(audioElement.currentTime)} / ${formatTime(audioElement.duration)}`;
        }
      });

      audioElement.addEventListener('ended', () => {
        isPlayingAudio = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        updateStatusText();
      });

      scrubberBar.addEventListener('click', (e) => {
        if (isFileLoaded && audioElement.duration) {
          const rect = scrubberBar.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const ratio = Math.max(0, Math.min(1, clickX / rect.width));
          audioElement.currentTime = ratio * audioElement.duration;
        }
      });

      // Volume slider & Mute
      volSlider.addEventListener('input', (e) => {
        currentVolume = parseFloat(e.target.value);
        if (masterGain && audioCtx) {
          masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
        }
        if (currentVolume > 0 && isMuted) {
          isMuted = false;
          volHighIcon.style.display = 'block';
          volMuteIcon.style.display = 'none';
        }
      });

      function toggleMute() {
        initAudioContext();
        isMuted = !isMuted;
        if (masterGain && audioCtx) {
          masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
        }
        if (isMuted) {
          volHighIcon.style.display = 'none';
          volMuteIcon.style.display = 'block';
        } else {
          volHighIcon.style.display = 'block';
          volMuteIcon.style.display = 'none';
        }
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          enterFsIcon.style.display = 'none';
          exitFsIcon.style.display = 'block';
        } else {
          document.exitFullscreen().catch(() => {});
          enterFsIcon.style.display = 'block';
          exitFsIcon.style.display = 'none';
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          enterFsIcon.style.display = 'none';
          exitFsIcon.style.display = 'block';
        } else {
          enterFsIcon.style.display = 'block';
          exitFsIcon.style.display = 'none';
        }
      });

      function updateStatusText() {
        if (isPlayingAudio) {
          statusText.innerHTML = `Music Active • Audio Reactive`;
        } else if (isZenActive) {
          statusText.innerHTML = `Zen Chords • Procedural Harmony`;
        } else if (isRainActive) {
          statusText.innerHTML = `Synthetic Rain • Reactive Loop`;
        } else if (isMicActive) {
          statusText.innerHTML = `Microphone • Live Reactivity`;
        } else {
          statusText.innerHTML = `Ambient Drizzle • Nocturnal Waters`;
        }
      }

      // ==========================================================================
      // SIMULATION DATA STRUCTURES & DROPLET CREATION
      // ==========================================================================

      // Ambient Spores drifting in the air
      for (let i = 0; i < 40; i++) {
        spores.push({
          x: Math.random() * width,
          y: Math.random() * (height * WATER_RATIO),
          radius: 0.6 + Math.random() * 1.4,
          alpha: 0.15 + Math.random() * 0.45,
          speedY: -0.15 - Math.random() * 0.25,
          speedX: (Math.random() - 0.5) * 0.25,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
        });
      }

      class Drop {
        constructor(customX, targetY, isBass = false, colorObj = null) {
          this.x = customX !== undefined ? customX : Math.random() * width;
          this.y = -20 - Math.random() * 30;

          // Water impact point in perspective: waterY to height
          if (targetY !== undefined) {
            this.targetY = targetY;
          } else {
            // Skew impact distribution slightly toward middle/foreground for depth
            const depthPower = Math.pow(Math.random(), 1.4);
            this.targetY = waterY + depthPower * (height - waterY * 0.98);
          }

          // Depth from 0 (horizon) to 1 (foreground)
          this.depth = Math.max(0.01, Math.min(1, (this.targetY - waterY) / (height - waterY)));

          // Falling speed scales with depth and audio energy
          const baseSpeed = 8 + this.depth * 14;
          this.vy = baseSpeed * (1 + audioOverall * 0.35);
          this.vx = (Math.random() - 0.5) * 0.4; // subtle drift

          // Visual streak length
          this.length = (14 + this.depth * 28) * (1 + audioOverall * 0.3);

          this.isBass = isBass;
          this.color = colorObj || (isBass ?
            BASS_PALETTE[Math.floor(Math.random() * BASS_PALETTE.length)] :
            PALETTE[Math.floor(Math.random() * PALETTE.length)]
          );

          this.alpha = 0.55 + this.depth * 0.4;
          this.width = (1.2 + this.depth * 1.6) * (isBass ? 1.4 : 1.0);
          this.vanished = false;
        }

        update(dt) {
          this.y += this.vy;
          this.x += this.vx;

          if (this.y >= this.targetY) {
            this.vanished = true;
            createRipple(this.x, this.targetY, this.isBass, this.color);
            createMicroSplash(this.x, this.targetY, this.color, this.depth);
          }
        }

        draw(ctx) {
          // Falling Drop Streak
          const topY = Math.max(0, this.y - this.length);
          const currentY = Math.min(this.y, this.targetY);
          if (currentY <= topY) return;

          const grad = ctx.createLinearGradient(this.x, topY, this.x, currentY);
          grad.addColorStop(0, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0)`);
          grad.addColorStop(0.7, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${this.alpha * 0.6})`);
          grad.addColorStop(1, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l + 10}%, ${this.alpha})`);

          ctx.beginPath();
          ctx.strokeStyle = grad;
          ctx.lineWidth = this.width;
          ctx.lineCap = 'round';
          ctx.moveTo(this.x, topY);
          ctx.lineTo(this.x, currentY);
          ctx.stroke();

          // Bioluminescent tip glow bead
          ctx.beginPath();
          ctx.fillStyle = `hsla(${this.color.h}, 100%, 88%, ${this.alpha * 0.9})`;
          ctx.arc(this.x, currentY, this.width * 0.9, 0, Math.PI * 2);
          ctx.fill();

          // Subtle rising reflection under the water surface as drop approaches impact
          if (this.y > waterY - 80) {
            const distToImpact = this.targetY - this.y;
            if (distToImpact > 0 && distToImpact < 120) {
              const reflY = this.targetY + distToImpact * 0.35;
              const reflLen = this.length * 0.45;
              const reflAlpha = (1 - distToImpact / 120) * this.alpha * 0.4;

              const reflGrad = ctx.createLinearGradient(this.x, reflY + reflLen, this.x, reflY);
              reflGrad.addColorStop(0, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0)`);
              reflGrad.addColorStop(1, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${reflAlpha})`);

              ctx.beginPath();
              ctx.strokeStyle = reflGrad;
              ctx.lineWidth = this.width * 1.5;
              ctx.moveTo(this.x, reflY + reflLen);
              ctx.lineTo(this.x, reflY);
              ctx.stroke();
            }
          }
        }
      }

      class Ripple {
        constructor(x, y, isBass = false, colorObj = null) {
          this.x = x;
          this.y = y;
          this.depth = Math.max(0.01, Math.min(1, (y - waterY) / (height - waterY)));

          // Aspect ratio: perspective flattening on horizontal water surface
          // Near horizon (depth ~ 0): ~0.20 flat; Foreground (depth ~ 1): ~0.32
          this.aspectRatio = 0.20 + 0.12 * this.depth;

          this.isBass = isBass;
          this.color = colorObj || (isBass ?
            BASS_PALETTE[Math.floor(Math.random() * BASS_PALETTE.length)] :
            PALETTE[Math.floor(Math.random() * PALETTE.length)]
          );

          // Expansion parameters
          if (isBass) {
            this.maxRadiusX = (180 + Math.random() * 80) * (0.8 + this.depth * 0.7);
            this.duration = 3.6 + Math.random() * 1.0;
            this.ringCount = 3;
            this.ringSpacing = 0.14;
            this.baseAlpha = 0.75;
          } else {
            this.maxRadiusX = (35 + Math.random() * 40) * (0.5 + this.depth * 0.9);
            this.duration = 2.0 + Math.random() * 0.8;
            this.ringCount = 2;
            this.ringSpacing = 0.18;
            this.baseAlpha = 0.6 + this.depth * 0.35;
          }

          this.age = 0;
          this.dead = false;
        }

        update(dt) {
          this.age += dt;
          if (this.age >= this.duration) {
            this.dead = true;
          }
        }

        draw(ctx) {
          const overallProgress = this.age / this.duration;

          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.scale(1, this.aspectRatio);

          // Central faint luminous dissipation sheen
          if (overallProgress < 0.6) {
            const sheenProgress = overallProgress / 0.6;
            const sheenRadius = this.maxRadiusX * 0.4 * Math.sin(sheenProgress * Math.PI * 0.5);
            const sheenAlpha = (1 - sheenProgress) * this.baseAlpha * 0.25;

            const radGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, sheenRadius);
            radGrad.addColorStop(0, `hsla(${this.color.h}, 100%, 82%, ${sheenAlpha})`);
            radGrad.addColorStop(1, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0)`);

            ctx.beginPath();
            ctx.fillStyle = radGrad;
            ctx.arc(0, 0, sheenRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw concentric rings
          for (let r = 0; r < this.ringCount; r++) {
            const ringStartOffset = r * this.ringSpacing;
            if (overallProgress < ringStartOffset) continue;

            const ringProgress = (overallProgress - ringStartOffset) / (1 - ringStartOffset);
            if (ringProgress <= 0 || ringProgress >= 1) continue;

            // Smooth ease-out expansion curve
            const easeOut = 1 - Math.pow(1 - ringProgress, 1.8);
            const currentRadius = this.maxRadiusX * easeOut * (1 - r * 0.15);

            // Opacity peaks early and gently dissolves to zero
            const fadeIn = Math.min(1, ringProgress * 4);
            const fadeOut = Math.pow(1 - ringProgress, 1.4);
            const ringAlpha = fadeIn * fadeOut * this.baseAlpha * (1 - r * 0.22);

            // Ring line width thins out as it expands
            const lineWidth = Math.max(0.75, (2.4 - ringProgress * 1.5) * (this.isBass ? 1.6 : 1.0));

            ctx.beginPath();
            ctx.strokeStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${ringAlpha})`;
            ctx.lineWidth = lineWidth;
            ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner harmonic light fringe for bass/primary ring
            if (this.isBass && r === 0 && ringProgress < 0.8) {
              ctx.beginPath();
              ctx.strokeStyle = `hsla(${this.color.h}, 100%, 88%, ${ringAlpha * 0.45})`;
              ctx.lineWidth = lineWidth * 2.8;
              ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
              ctx.stroke();
            }
          }

          ctx.restore();
        }
      }

      class Splash {
        constructor(x, y, colorObj, depth) {
          this.x = x;
          this.y = y;
          this.depth = depth;
          this.color = colorObj;
          this.vx = (Math.random() - 0.5) * (1.5 + depth * 1.5);
          this.vy = -(1.8 + Math.random() * 2.2 + depth * 1.4);
          this.gravity = 0.18;
          this.radius = 0.9 + Math.random() * 1.3 + depth * 0.8;
          this.alpha = 0.85;
          this.targetY = y;
          this.dead = false;
        }

        update(dt) {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += this.gravity;
          this.alpha -= 0.035;

          if (this.alpha <= 0 || (this.vy > 0 && this.y >= this.targetY)) {
            this.dead = true;
          }
        }

        draw(ctx) {
          ctx.beginPath();
          ctx.fillStyle = `hsla(${this.color.h}, 100%, 85%, ${Math.max(0, this.alpha)})`;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function createRipple(x, y, isBass = false, colorObj = null) {
        ripples.push(new Ripple(x, y, isBass, colorObj));
      }

      function createMicroSplash(x, y, colorObj, depth) {
        const count = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          splashes.push(new Splash(x, y, colorObj, depth));
        }
      }

      // ==========================================================================
      // AUDIO ANALYSIS & REACTIVITY LOOP
      // ==========================================================================

      function updateAudioFeatures() {
        if (!analyser || !freqData) {
          audioBass = 0;
          audioMid = 0;
          audioHigh = 0;
          audioOverall = 0;
          return;
        }

        analyser.getByteFrequencyData(freqData);

        // Sub/Bass: bins 1 to 5 (~40Hz - 215Hz)
        let bassSum = 0;
        const bassCount = 5;
        for (let i = 1; i <= bassCount; i++) bassSum += freqData[i];
        const rawBass = (bassSum / bassCount) / 255;

        // Mids: bins 8 to 35 (~350Hz - 1500Hz)
        let midSum = 0;
        const midCount = 28;
        for (let i = 8; i < 8 + midCount; i++) midSum += freqData[i];
        const rawMid = (midSum / midCount) / 255;

        // Highs: bins 50 to 140 (~2100Hz - 6000Hz)
        let highSum = 0;
        const highCount = 90;
        for (let i = 50; i < 50 + highCount; i++) highSum += freqData[i];
        const rawHigh = (highSum / highCount) / 255;

        // Smooth energy metrics
        audioBass = audioBass * 0.75 + rawBass * 0.25;
        audioMid = audioMid * 0.75 + rawMid * 0.25;
        audioHigh = audioHigh * 0.75 + rawHigh * 0.25;
        audioOverall = audioBass * 0.45 + audioMid * 0.35 + audioHigh * 0.2;

        // Bass Beat / Onset Detection:
        // Track running average of bass to detect prominent beat kicks
        bassEMA = bassEMA * 0.94 + audioBass * 0.06;
        const now = performance.now();
        if (audioBass > bassEMA * 1.32 && audioBass > 0.28 && (now - lastBassDropTime > 340)) {
          lastBassDropTime = now;
          triggerBassImpact();
        }

        // Shimmering Highs: scatter sparkling drops
        if (audioHigh > 0.18 && Math.random() < audioHigh * 0.7) {
          triggerShimmerDrop();
        }
      }

      function triggerBassImpact() {
        // Bass triggers larger, slower-expanding central ripples in warm or deep tones
        const centerX = width * 0.5 + (Math.random() - 0.5) * width * 0.42;
        const targetY = waterY + (height - waterY) * (0.35 + Math.random() * 0.45);
        drops.push(new Drop(centerX, targetY, true));
      }

      function triggerShimmerDrop() {
        // Highs trigger lighter, shimmering drops scattered across the water plane
        const randX = Math.random() * width;
        const targetY = waterY + (height - waterY) * Math.random();
        const shimmerColor = PALETTE[Math.random() < 0.6 ? 0 : 3]; // cyan or seafoam
        drops.push(new Drop(randX, targetY, false, shimmerColor));
      }

      // ==========================================================================
      // MAIN RENDERING LOOP & PERSPECTIVE SCENE
      // ==========================================================================

      let lastTimestamp = performance.now();

      function render(timestamp) {
        requestAnimationFrame(render);

        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = timestamp;

        updateAudioFeatures();

        // ----------------------------------------------------------------------
        // Spawn Droplets
        // Baseline idle "ambient drizzle": ~3-5 drops per second
        // Amplitude scaling: smoothly scales up to ~14 drops/sec without overwhelming
        // ----------------------------------------------------------------------
        const spawnInterval = 1000 / (3.5 + audioOverall * 11);
        if (timestamp - lastDropSpawnTime > spawnInterval) {
          lastDropSpawnTime = timestamp;
          drops.push(new Drop());
        }

        // Clear canvas
        ctx.save();
        ctx.scale(dpr, dpr);

        // ----------------------------------------------------------------------
        // 1. SCENE BACKGROUND: Deep Midnight Sky & Atmosphere
        // ----------------------------------------------------------------------
        // Deep midnight gradient (#050914 to #0b1528)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
        skyGrad.addColorStop(0, '#050914');
        skyGrad.addColorStop(0.7, '#081122');
        skyGrad.addColorStop(1, '#0b1528');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, waterY);

        // Distant atmospheric mist/aurora haze right above the horizon line
        const mistGrad = ctx.createLinearGradient(0, waterY - 80, 0, waterY);
        mistGrad.addColorStop(0, 'rgba(11, 21, 40, 0)');
        mistGrad.addColorStop(1, 'rgba(25, 55, 95, 0.22)');
        ctx.fillStyle = mistGrad;
        ctx.fillRect(0, waterY - 80, width, 80);

        // Soft floating ambient bioluminescent spores in the air
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < spores.length; i++) {
          const sp = spores[i];
          sp.y += sp.speedY;
          sp.x += sp.speedX;
          if (sp.y < -10) {
            sp.y = waterY - 2;
            sp.x = Math.random() * width;
          }
          ctx.beginPath();
          ctx.fillStyle = `hsla(${sp.color.h}, ${sp.color.s}%, ${sp.color.l}%, ${sp.alpha * (0.8 + audioOverall * 0.4)})`;
          ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        // ----------------------------------------------------------------------
        // 2. WATER BODY & DEPTH GRADIENT
        // ----------------------------------------------------------------------
        // Water plane starts at waterY (65% down viewport)
        const waterHeight = height - waterY;
        const waterGrad = ctx.createLinearGradient(0, waterY, 0, height);
        waterGrad.addColorStop(0, '#081326');
        waterGrad.addColorStop(0.3, '#060f1f');
        waterGrad.addColorStop(0.7, '#040916');
        waterGrad.addColorStop(1, '#02050c');
        ctx.fillStyle = waterGrad;
        ctx.fillRect(0, waterY, width, waterHeight);

        // Undersea Bioluminescent Glow / Bass Caustic Pulse
        const deepPulse = 0.12 + audioBass * 0.28;
        const causticGrad = ctx.createRadialGradient(
          width * 0.5, waterY + waterHeight * 0.45, 10,
          width * 0.5, waterY + waterHeight * 0.45, width * 0.6
        );
        causticGrad.addColorStop(0, `rgba(45, 120, 190, ${deepPulse})`);
        causticGrad.addColorStop(0.5, `rgba(75, 45, 140, ${deepPulse * 0.45})`);
        causticGrad.addColorStop(1, 'rgba(5, 12, 28, 0)');
        ctx.fillStyle = causticGrad;
        ctx.fillRect(0, waterY, width, waterHeight);

        // Water surface horizon line: gentle undulating luminous line
        ctx.beginPath();
        const waveTime = timestamp * 0.0015;
        const waveAmp = 0.8 + audioBass * 2.2;
        ctx.moveTo(0, waterY);
        for (let x = 0; x <= width; x += 30) {
          const waveY = waterY + Math.sin(x * 0.008 + waveTime) * waveAmp;
          ctx.lineTo(x, waveY);
        }
        ctx.strokeStyle = `rgba(130, 195, 255, ${0.18 + audioOverall * 0.2})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // ----------------------------------------------------------------------
        // 3. DROPS, RIPPLES & SPLASHES (BLENDED WITH 'lighter')
        // ----------------------------------------------------------------------
        // "Use 'screen' or 'lighter' blend mode so overlapping ripples merge into gentle light interference."
        ctx.globalCompositeOperation = 'lighter';

        // Update & Render Ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.update(dt);
          r.draw(ctx);
          if (r.dead) ripples.splice(i, 1);
        }

        // Update & Render Splashes
        for (let i = splashes.length - 1; i >= 0; i--) {
          const sp = splashes[i];
          sp.update(dt);
          sp.draw(ctx);
          if (sp.dead) splashes.splice(i, 1);
        }

        // Update & Render Falling Drops
        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];
          d.update(dt);
          d.draw(ctx);
          if (d.vanished) drops.splice(i, 1);
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }

      // ==========================================================================
      // RESIZE & CANVAS SETUP
      // ==========================================================================

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        waterY = height * WATER_RATIO;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ==========================================================================
      // INTERACTIVE SOUNDBOARD: CLICK & TAP TO RING RIPPLES
      // ==========================================================================

      function handleInteraction(clientX, clientY) {
        initAudioContext();

        // If clicked in sky, drop a streak directly down to water plane at that X
        if (clientY < waterY) {
          const targetY = waterY + (height - waterY) * (0.2 + Math.random() * 0.65);
          const drop = new Drop(clientX, targetY);
          drop.y = clientY; // start drop at click height
          drops.push(drop);

          // Trigger harmonic pentatonic chime based on X coordinate
          const pitchIdx = Math.floor((clientX / width) * CHIME_FREQS.length);
          playWaterDropChime(pitchIdx, (targetY - waterY) / (height - waterY));
        } else {
          // Clicked directly on the water: instantaneous ripple and chime!
          const depth = (clientY - waterY) / (height - waterY);
          const pitchIdx = Math.floor((clientX / width) * CHIME_FREQS.length);
          createRipple(clientX, clientY, false);
          createMicroSplash(clientX, clientY, PALETTE[pitchIdx % PALETTE.length], depth);
          playWaterDropChime(pitchIdx, depth);
        }

        // Hide hint toast on first interaction
        hintToast.classList.add('fade-out');
      }

      canvas.addEventListener('pointerdown', (e) => {
        handleInteraction(e.clientX, e.clientY);
      });

      // ==========================================================================
      // MINIMALIST CONTROLS AUTO-HIDE LOGIC (3 SECONDS IDLE)
      // ==========================================================================

      function resetIdleTimer() {
        controlDock.classList.remove('idle');
        topBar.classList.remove('idle');
        trackPill.classList.remove('idle');

        clearTimeout(idleTimer);

        if (!isDockHovered) {
          idleTimer = setTimeout(() => {
            controlDock.classList.add('idle');
            topBar.classList.add('idle');
            trackPill.classList.add('idle');
          }, 3000);
        }
      }

      window.addEventListener('mousemove', resetIdleTimer);
      window.addEventListener('mousedown', resetIdleTimer);
      window.addEventListener('touchstart', resetIdleTimer, { passive: true });
      window.addEventListener('keydown', resetIdleTimer);

      controlDock.addEventListener('mouseenter', () => {
        isDockHovered = true;
        clearTimeout(idleTimer);
      });

      controlDock.addEventListener('mouseleave', () => {
        isDockHovered = false;
        resetIdleTimer();
      });

      // Start initial idle timer
      resetIdleTimer();

      // Fade out hint toast automatically after 5 seconds
      setTimeout(() => {
        hintToast.classList.add('fade-out');
      }, 5000);

      // ==========================================================================
      // UI BUTTON LISTENERS & SHORTCUTS
      // ==========================================================================

      uploadBtn.addEventListener('click', () => {
        audioFileInput.click();
      });

      audioFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleAudioFileUpload(e.target.files[0]);
        }
      });

      playBtn.addEventListener('click', togglePlayPause);
      rainBtn.addEventListener('click', toggleSyntheticRain);
      zenBtn.addEventListener('click', toggleZenMusic);
      micBtn.addEventListener('click', toggleMicrophone);
      muteBtn.addEventListener('click', toggleMute);
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      chimeBtn.addEventListener('click', () => {
        isChimeActive = !isChimeActive;
        if (isChimeActive) {
          chimeBtn.classList.add('active');
        } else {
          chimeBtn.classList.remove('active');
        }
      });

      // Drag and Drop Audio Files
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('active');
      });

      window.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null) {
          dragOverlay.classList.remove('active');
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleAudioFileUpload(e.dataTransfer.files[0]);
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const key = e.key.toLowerCase();

        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayPause();
        } else if (key === 'r') {
          toggleSyntheticRain();
        } else if (key === 'z') {
          toggleZenMusic();
        } else if (key === 'm') {
          toggleMute();
        } else if (key === 'f') {
          toggleFullscreen();
        } else if (key === 'c') {
          isChimeActive = !isChimeActive;
          if (isChimeActive) chimeBtn.classList.add('active');
          else chimeBtn.classList.remove('active');
        }
      });

      // Start Simulation Loop
      requestAnimationFrame(render);

    })();
  </script>
</body>
</html>
