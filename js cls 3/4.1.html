<!DOCTYPE html>
<html><body>
<pre id="out" style="font:14px/1.5 monospace; padding:16px;background:#f5f5f5">
</pre>
<script>
const log = m => document.getElementById("out").textContent += m + "\n";
let x = 1;
function test () {
let y = 2;
if (true) { let z = 3; log("inside: " + z); }
try { log(z); } catch(e) { log("z বাইরে নাই: " + e.message); }
log("y = " + y + ", x = " + x);
}
test();
</script>
</body></html>
