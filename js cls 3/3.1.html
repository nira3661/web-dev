<!DOCTYPE html>
<html><body>
<pre id="out" style="font:14px/1.5 monospace; padding:16px;background:#f5f5f5">
</pre>
<script>
const log = m => document.getElementById("out").textContent += m + "\n";
function greet (name = "Guest") { return "Hi " + name; }
const sum = (...nums) => nums.reduce((a,b)=>a+b, 0);
log(greet());
log(greet ("Rahim"));
log("sum(1..5) = " + sum(1, 2, 3, 4, 5));
</script>
</body></html>
