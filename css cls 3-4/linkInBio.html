<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal links and portfolio showcase for Alex Rivera.">
  <title>Alex Rivera | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="StylesLinkInBio.css">
</head>
<body>

  <main class="page-container">
    
    <!-- Profile / Bio Header -->
    <header class="profile-header">
      <div class="avatar-wrapper">
        <img 
          src="https://cdn.imgpile.com/f/3TRjlBY_lg.webp" 
          alt="Portrait of Alex Rivera" 
          class="avatar-img"
          width="96" 
          height="96"
          loading="eager"
        >
      </div>
      <h1 class="profile-name">Alex Rivera</h1>
      <p class="profile-handle">@alexrivera</p>
      <p class="profile-bio">
        Design engineer building fluid web interfaces, design systems, and thoughtful digital products.
      </p>
    </header>

    <!-- Stacked Link List -->
    <nav class="links-section" aria-label="Social and personal links">
      <ul class="links-list">
        
        <li class="link-item">
          <a href="https://example.com" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="link-icon" aria-hidden="true">
              <!-- Portfolio / Globe Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span class="link-label">Portfolio & Case Studies</span>
            <span class="link-arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l5 5-5 5"></path>
              </svg>
            </span>
          </a>
        </li>

        <li class="link-item">
          <a href="https://github.com" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="link-icon" aria-hidden="true">
              <!-- GitHub Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
              </svg>
            </span>
            <span class="link-label">GitHub Projects</span>
            <span class="link-arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l5 5-5 5"></path>
              </svg>
            </span>
          </a>
        </li>

        <li class="link-item">
          <a href="https://linkedin.com" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="link-icon" aria-hidden="true">
              <!-- LinkedIn Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect x="2" y="9" width="4" height="12"></rect>
                <circle cx="4" cy="4" r="2"></circle>
              </svg>
            </span>
            <span class="link-label">LinkedIn</span>
            <span class="link-arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l5 5-5 5"></path>
              </svg>
            </span>
          </a>
        </li>

        <li class="link-item">
          <a href="https://substack.com" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="link-icon" aria-hidden="true">
              <!-- Newsletter / Mail Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <span class="link-label">Bi-weekly Newsletter</span>
            <span class="link-arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l5 5-5 5"></path>
              </svg>
            </span>
          </a>
        </li>

        <li class="link-item">
          <a href="mailto:hello@example.com" class="link-card">
            <span class="link-icon" aria-hidden="true">
              <!-- Contact / Chat Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </span>
            <span class="link-label">Get in Touch</span>
            <span class="link-arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l5 5-5 5"></path>
              </svg>
            </span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Footer -->
    <footer class="page-footer">
      <p>&copy; 2026 Alex Rivera. All rights reserved.</p>
    </footer>

  </main>

</body>
</html>
