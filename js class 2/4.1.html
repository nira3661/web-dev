<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#f5f5f5">
</pre>
<script>
const log = m => document.getElementById("out").textContent += m + "\n";
["sat", "mon", "fri", "sun"].forEach(day => {
let type;
switch (day) {
case "sat": case "sun": type = "Weekend"; break;
default: type = "Weekday";
}
log(day + " → " + type);
});
</script>
</body>
</html>
