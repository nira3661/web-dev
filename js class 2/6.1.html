<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#f5f5f5">
</pre>
<script>
const log = m => document.getElementById("out").textContent += m + "\n";
let n = 5;
while (n > 0) { log("count: " + n); n--; }
do { log("do-while অন্তত ১ বার"); } while (false);
</script>
</body>
</html>
