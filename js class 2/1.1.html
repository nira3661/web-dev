<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace; padding:16px;background:#f5f5f5">
</pre>
<script>
const log = m => document.getElementById("out").textContent += m + "\n";
[5, 15, 25].forEach(age => {
if (age >= 18)log(age + " Adult");
else if (age >= 13) log(age + " Teen");
else log(age + " Child");
});
</script>
</body>
</html>
